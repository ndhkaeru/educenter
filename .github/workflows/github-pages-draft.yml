name: Draft Preview

on:
  push:
    branches:
      - cms-draft
  workflow_dispatch:

concurrency:
  group: github-pages-draft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: theme

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  ensure-release-pr:
    if: github.ref_name == 'cms-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Ensure PR from cms-draft to release exists
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:cms-draft`;
            const base = 'release';

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base,
              per_page: 100
            });

            if (pulls.length > 0) {
              core.info(`Open PR already exists: #${pulls[0].number}`);
              return;
            }

            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              title: 'Sync cms-draft into release',
              head: 'cms-draft',
              base,
              body: [
                'This pull request was created automatically after new content was saved to `cms-draft`.',
                '',
                '- Draft preview: GitHub Pages',
                '- Production branch target: `release`',
                '',
                'Please review and merge when the draft is approved.'
              ].join('\n')
            });

            core.info(`Created PR #${pull.number}`);
