<section class="section pt-0">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-8">
        <h2 id="@@title-id" class="section-title mb-3">@@title</h2>
        <div id="@@body-id" class="mb-0 rich-text-content">@@body</div>
      </div>
      <div class="col-lg-4 text-lg-right mt-4 mt-lg-0">
        <a id="@@button-id" href="@@button-url" class="btn btn-primary">@@button-label</a>
      </div>
    </div>
  </div>
</section>
