      - { name: formTitle, label: Tiêu đề khối Google Form, type: string, required: true }
      - name: formDescription
        label: Mô tả khối Google Form
        type: rich-text
        required: true
        options:
          media: false
      - name: googleFormEmbed
        label: Link nhúng hoặc mã iframe Google Form
        type: text
        required: true
        description: Dán link dạng https://docs.google.com/forms/.../viewform?embedded=true hoặc dán nguyên thẻ iframe. Không nên dán link rút gọn forms.gle vào ô này.
        options:
          rows: 4
      - name: googleFormHeight
        label: Chiều cao form (px)
        type: number
        required: true
        description: Hệ thống tự set width 100 phần trăm. Bạn chỉ cần chỉnh chiều cao, thường khoảng 900 đến 1100 là phù hợp.
        options:
          min: 600
          max: 2400
          step: 1
      - name: googleFormLabel
        label: Tên nút mở form
        type: string
        required: true
        description: Nút mở Google Form ở tab mới để dự phòng khi iframe tải chậm.
      - name: googleFormUrl
        label: Liên kết mở form ở tab mới
        type: string
        required: true
        description: Có thể dán link forms.gle hoặc link viewform đầy đủ.
      - { name: helperTitle, label: Tiêu đề khối hướng dẫn, type: string, required: true }
      - name: helperBody
        label: Nội dung khối hướng dẫn
