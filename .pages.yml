content:
  - name: site
    label: Cài đặt chung
    type: file
    path: source/static/data/site.json
    format: json
    fields:
      - { name: siteName, label: Tên website, type: string, required: true }
      - { name: defaultMetaTitle, label: Tiêu đề mặc định, type: string, required: true }
      - { name: defaultMetaDescription, label: Mô tả mặc định, type: text, required: true }
      - name: brandDescription
        label: Mô tả thương hiệu
        type: rich-text
        required: true
        options:
          media: false
      - name: logo
        label: Logo
        type: image
        required: true
        description: Logo hiện tại là 200x68 px. Khi thay ảnh mới, nên giữ tỉ lệ ngang này hoặc dùng ảnh lớn hơn cùng tỉ lệ.
        options:
          media: branding
          extensions: [png, jpg, jpeg, webp, svg]
      - name: favicon
        label: Favicon
        type: image
        required: true
        description: Favicon hiện tại là 60x68 px. Khi thay ảnh mới, nên dùng ảnh nhỏ, rõ nét và ưu tiên giữ kích thước gần mức này.
        options:
          media: branding
          extensions: [png, jpg, jpeg, webp, svg, ico]
      - { name: hotlineText, label: Hotline hiển thị, type: string, required: true }
      - { name: hotlineHref, label: Liên kết hotline, type: string, required: true }
      - { name: emailText, label: Email hiển thị, type: string, required: true }
      - { name: emailHref, label: Liên kết email, type: string, required: true }
      - { name: zaloText, label: Zalo hiển thị, type: string, required: true }
      - { name: zaloUrl, label: Liên kết Zalo, type: string, required: true }
      - { name: facebookText, label: Facebook hiển thị, type: string, required: true }
      - { name: facebookUrl, label: Liên kết Facebook, type: string, required: true }
      - { name: address, label: Địa chỉ hoặc khu vực phục vụ, type: string, required: true }
      - { name: copyright, label: Copyright, type: string, required: true }
      - name: navigation
        label: Menu chính
        type: object
        list: true
        fields:
          - { name: label, label: Tên menu, type: string, required: true }
          - { name: url, label: Liên kết, type: string, required: true }
          - name: children
            label: Dropdown cấp 1
            type: object
            list: true
            fields:
              - { name: label, label: Tên mục, type: string, required: true }
              - { name: url, label: Liên kết, type: string, required: true }
              - name: children
                label: Dropdown cấp 2
                type: object
                list: true
                fields:
                  - { name: label, label: Tên mục, type: string, required: true }
                  - { name: url, label: Liên kết, type: string, required: true }

  - name: home
    label: Trang chủ
    type: file
    path: source/static/data/home.json
    format: json
    fields:
      - name: heroBackground
        label: Ảnh nền hero
        type: image
        required: true
        description: Ảnh hiện tại là 1600x834 px. Khi thay ảnh mới, nên giữ đúng tỉ lệ này hoặc dùng ảnh lớn hơn cùng tỉ lệ.
        options:
          media: banner_images
      - name: heroSlides
        label: Slide hero
        type: object
        list: true
        fields:
          - { name: title, label: Tiêu đề, type: string, required: true }
          - name: description
            label: Mô tả
            type: rich-text
            required: true
            options:
              media: false
          - { name: buttonLabel, label: Tên nút, type: string, required: true }
          - { name: buttonUrl, label: Liên kết nút, type: string, required: true }
      - name: featureImage
        label: Ảnh feature
        type: image
        required: true
        description: Ảnh hiện tại là 591x700 px. Khi thay ảnh mới, nên giữ đúng tỉ lệ dọc này hoặc dùng ảnh lớn hơn cùng tỉ lệ.
        options:
          media: banner_images
      - name: features
        label: Thẻ lợi ích
        type: object
        list: true
        fields:
          - { name: icon, label: Icon Themify, type: string, required: true }
          - { name: title, label: Tiêu đề, type: string, required: true }
          - name: description
            label: Mô tả
            type: rich-text
            required: true
            options:
              media: false
      - name: aboutPreview
        label: Giới thiệu ngắn trên trang chủ
        type: object
        fields:
          - name: image
            label: Ảnh
            type: image
            required: true
            description: Ảnh hiện tại là 816x504 px. Khi thay ảnh mới, nên giữ đúng tỉ lệ này hoặc dùng ảnh lớn hơn cùng tỉ lệ.
            options:
              media: about_images
          - { name: title, label: Tiêu đề, type: string, required: true }
          - name: body
            label: Nội dung
            type: rich-text
            required: true
            options:
              media: false
          - { name: buttonLabel, label: Tên nút, type: string, required: true }
          - { name: buttonUrl, label: Liên kết nút, type: string, required: true }
      - { name: courseSectionTitle, label: Tiêu đề khóa học, type: string, required: true }
      - name: courseSectionText
        label: Mô tả khóa học
        type: rich-text
        required: true
        options:
          media: false
      - name: cta
        label: CTA giữa trang
        type: object
        fields:
          - { name: eyebrow, label: Nhãn phụ, type: string, required: true }
          - { name: title, label: Tiêu đề, type: string, required: true }
          - { name: buttonLabel, label: Tên nút, type: string, required: true }
          - { name: buttonUrl, label: Liên kết nút, type: string, required: true }
      - name: video
        label: Khu video demo
        type: object
        fields:
          - name: backgroundImage
            label: Ảnh nền
            type: image
            required: true
            description: Ảnh hiện tại là 1280x1183 px. Khi thay ảnh mới, nên giữ đúng tỉ lệ gần vuông này hoặc dùng ảnh lớn hơn cùng tỉ lệ.
            options:
              media: background_images
          - { name: videoUrl, label: Liên kết video, type: string, required: true }
          - { name: title, label: Tiêu đề, type: string, required: true }
          - name: description
            label: Mô tả
            type: rich-text
            required: true
            options:
              media: false
          - name: points
            label: Điểm nhấn
            type: text
            list: true
          - { name: buttonLabel, label: Tên nút, type: string, required: true }
          - { name: buttonUrl, label: Liên kết nút, type: string, required: true }
      - { name: feedbackSectionTitle, label: Tiêu đề feedback, type: string, required: true }
      - name: feedbackSectionText
        label: Mô tả feedback
        type: rich-text
        required: true
        options:
          media: false
      - { name: blogSectionTitle, label: Tiêu đề blog, type: string, required: true }
      - name: blogSectionText
        label: Mô tả blog
        type: rich-text
        required: true
        options:
          media: false

